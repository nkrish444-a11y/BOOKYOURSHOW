<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Started</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #333;
        }

        /* =========================
           BACKGROUND OVERLAY
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.65);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;
        }


        /* =========================
           MAIN MODAL
        ========================= */

        .modal {
            width: 645px;
            max-width: 100%;

            min-height: 650px;

            background: white;

            border-radius: 12px;

            position: relative;

            padding: 28px 72px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.3);
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close {
            position: absolute;

            top: 20px;
            right: 22px;

            border: none;
            background: transparent;

            font-size: 34px;

            font-weight: 200;

            color: #333;

            cursor: pointer;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            text-align: center;

            font-size: 25px;

            font-weight: 600;

            margin-bottom: 50px;

            color: #111;
        }


        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .social-btn {
            width: 100%;

            height: 68px;

            background: white;

            border: 1px solid #999;

            border-radius: 6px;

            margin-bottom: 32px;

            position: relative;

            cursor: pointer;

            transition: 0.2s;
        }

        .social-btn:hover {
            background: #f7f7f7;
        }


        .social-icon {
            position: absolute;

            left: 28px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 25px;
        }


        .social-text {
            font-size: 20px;

            font-weight: 600;

            color: #5b5b5b;
        }


        /* Google */

        .google {
            color: #4285f4;
            font-weight: bold;
            font-size: 28px;
        }


        /* Apple */

        .apple {
            color: #000;
            font-size: 28px;
        }


        /* =========================
           OR
        ========================= */

        .or {
            text-align: center;

            font-size: 20px;

            color: #777;

            margin-top: 5px;

            margin-bottom: 58px;
        }


        /* =========================
           MOBILE LOGIN
        ========================= */

        .mobile-login {
            display: flex;

            align-items: center;

            width: 100%;

            border-bottom: 1px solid #ccc;

            height: 48px;
        }


        .country {
            width: 130px;

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 19px;

            color: #444;
        }


        /* India flag */

        .flag {
            width: 30px;
            height: 21px;

            display: flex;

            flex-direction: column;
        }

        .orange {
            height: 7px;
            background: #ff9933;
        }

        .white {
            height: 7px;
            background: white;

            position: relative;
        }

        .green {
            height: 7px;
            background: #138808;
        }

        .chakra {
            position: absolute;

            width: 6px;
            height: 6px;

            border: 1px solid #000080;

            border-radius: 50%;

            left: 12px;
            top: 0;
        }


        .arrow {
            width: 8px;
            height: 8px;

            border-right: 1.5px solid #555;
            border-bottom: 1.5px solid #555;

            transform: rotate(45deg);

            margin-top: -5px;
        }


        .mobile-input {
            flex: 1;

            border: none;

            outline: none;

            font-size: 20px;

            padding: 8px 0;
        }

        .mobile-input::placeholder {
            color: #888;
        }


        /* =========================
           TERMS
        ========================= */

        .terms {
            position: absolute;

            bottom: 35px;

            left: 0;

            width: 100%;

            text-align: center;

            color: #999;

            font-size: 16px;

            line-height: 23px;
        }

        .terms a {
            color: #999;

            text-decoration: underline;
        }


        /* =========================
           SECOND SCREEN
        ========================= */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }


        .back {
            border: none;

            background: transparent;

            font-size: 18px;

            color: #555;

            cursor: pointer;

            margin-bottom: 25px;
        }


        .screen-title {
            text-align: center;

            font-size: 26px;

            margin-bottom: 10px;
        }


        .screen-subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 35px;

            line-height: 24px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;
        }


        .form-input {
            width: 100%;

            height: 52px;

            border: 1px solid #aaa;

            border-radius: 6px;

            padding: 0 15px;

            font-size: 17px;

            outline: none;
        }

        .form-input:focus {
            border-color: #555;
        }


        /* Password */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            color: #555;

            font-size: 14px;
        }


        /* =========================
           MAIN ACTION BUTTON
        ========================= */

        .continue-btn {
            width: 100%;

            height: 55px;

            border: none;

            border-radius: 6px;

            background: #111;

            color: white;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;
        }

        .continue-btn:hover {
            background: #333;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 18px;

            text-align: center;

            font-size: 15px;

            color: #666;
        }


        /* =========================
           OTP
        ========================= */

        .otp-container {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin: 30px 0;
        }

        .otp {
            width: 48px;

            height: 55px;

            text-align: center;

            font-size: 24px;

            border: 1px solid #aaa;

            border-radius: 6px;

            outline: none;
        }

        .otp:focus {
            border-color: #111;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 700px) {

            .modal {
                min-height: 600px;

                padding: 25px 30px;
            }

            .social-text {
                font-size: 17px;
            }

            .social-icon {
                left: 20px;
            }

            .country {
                width: 115px;
            }

            .mobile-input {
                font-size: 17px;
            }
        }


        @media(max-width: 400px) {

            .modal {
                padding: 25px 20px;
            }

            .social-btn {
                height: 60px;
            }

            .social-text {
                font-size: 15px;
            }

            .country {
                width: 105px;
            }

            .otp {
                width: 42px;
            }
        }

    </style>

</head>


<body>


<div class="overlay">


    <div class="modal">


        <!-- CLOSE -->
        <button class="close" onclick="closeModal()">
            ×
        </button>


        <!-- ===================================
             SCREEN 1
        ==================================== -->

        <div id="mainScreen" class="screen active">

            <h1 class="title">
                Get Started
            </h1>


            <!-- GOOGLE -->

            <button
                class="social-btn"
                onclick="googleLogin()"
            >

                <span class="social-icon google">
                    G
                </span>

                <span class="social-text">
                    Continue with Google
                </span>

            </button>


            <!-- EMAIL -->

            <button
                class="social-btn"
                onclick="showEmail()"
            >

                <span class="social-icon">
                    ✉
                </span>

                <span class="social-text">
                    Continue with Email
                </span>

            </button>


            <!-- APPLE -->

            <button
                class="social-btn"
                onclick="appleLogin()"
            >

                <span class="social-icon apple">
                    ●
                </span>

                <span class="social-text">
                    Continue with Apple
                </span>

            </button>


            <div class="or">
                OR
            </div>


            <!-- MOBILE -->

            <form id="mobileForm">

                <div class="mobile-login">


                    <div class="country">

                        <div class="flag">

                            <div class="orange"></div>

                            <div class="white">
                                <span class="chakra"></span>
                            </div>

                            <div class="green"></div>

                        </div>

                        <span>
                            +91
                        </span>

                        <span class="arrow"></span>

                    </div>


                    <input
                        id="mobileNumber"
                        class="mobile-input"
                        type="tel"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        placeholder="Continue with mobile number"
                        required
                    >

                </div>

            </form>


            <div class="terms">

                By continuing, you agree to our<br>

                <a href="#">
                    Terms & Conditions
                </a>

                and

                <a href="#">
                    Privacy Policy
                </a>

            </div>

        </div>



        <!-- ===================================
             EMAIL SCREEN
        ==================================== -->

        <div id="emailScreen" class="screen">

            <button
                class="back"
                onclick="showMain()"
            >
                ← Back
            </button>


            <h2 class="screen-title">
                Sign in with Email
            </h2>


            <p class="screen-subtitle">
                Enter your email and password<br>
                to continue.
            </p>


            <form id="emailForm">


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        id="email"
                        class="form-input"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            id="password"
                            class="form-input"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="continue-btn"
                >
                    Login
                </button>


                <div
                    id="emailMessage"
                    class="message"
                ></div>

            </form>

        </div>



        <!-- ===================================
             OTP SCREEN
        ==================================== -->

        <div id="otpScreen" class="screen">


            <button
                class="back"
                onclick="showMain()"
            >
                ← Back
            </button>


            <h2 class="screen-title">
                Verify Mobile Number
            </h2>


            <p class="screen-subtitle">

                Enter the 6-digit OTP sent to<br>

                <strong id="displayNumber"></strong>

            </p>


            <form id="otpForm">


                <div class="otp-container">

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp"
                        maxlength="1"
                        inputmode="numeric"
                    >

                </div>


                <button
                    type="submit"
                    class="continue-btn"
                >
                    Verify OTP
                </button>


                <div
                    id="otpMessage"
                    class="message"
                ></div>


            </form>

        </div>


    </div>

</div>



<script>


/* ==========================================
   SCREEN FUNCTIONS
========================================== */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

    document
        .getElementById(screenId)
        .classList.add("active");
}


function showMain() {

    showScreen("mainScreen");

}


function showEmail() {

    showScreen("emailScreen");

}


function closeModal() {

    document.querySelector(".overlay").style.display = "none";

}


/* ==========================================
   GOOGLE
========================================== */

function googleLogin() {

    alert(
        "Google Login selected.\n\n" +
        "To make this real, connect Google OAuth."
    );

}


/* ==========================================
   APPLE
========================================== */

function appleLogin() {

    alert(
        "Apple Login selected.\n\n" +
        "To make this real, connect Apple Sign In."
    );

}


/* ==========================================
   EMAIL LOGIN
========================================== */

document
    .getElementById("emailForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("emailMessage");


        if (password.length < 6) {

            message.textContent =
                "Password must contain at least 6 characters.";

            return;

        }


        message.textContent =
            "Login successful (demo).";


        console.log("Email:", email);
        console.log("Password:", password);

    });


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "Hide";

    } else {

        password.type = "password";

        button.textContent = "Show";

    }

}


/* ==========================================
   MOBILE NUMBER
========================================== */

document
    .getElementById("mobileForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

    });


document
    .getElementById("mobileNumber")
    .addEventListener("input", function() {

        /* Only numbers */

        this.value =
            this.value.replace(/\D/g, "");


        /* 10 digits */

        if (this.value.length === 10) {

            const number = this.value;


            document
                .getElementById("displayNumber")
                .textContent =
                "+91 " + number;


            showScreen("otpScreen");


            console.log(
                "Demo OTP: 123456"
            );

        }

    });


/* ==========================================
   OTP INPUT
========================================== */

const otpInputs =
    document.querySelectorAll(".otp");


otpInputs.forEach((input, index) => {


    input.addEventListener("input", function() {


        this.value =
            this.value.replace(/\D/g, "");


        if (
            this.value &&
            index < otpInputs.length - 1
        ) {

            otpInputs[index + 1].focus();

        }

    });


    input.addEventListener("keydown", function(event) {


        if (
            event.key === "Backspace" &&
            !this.value &&
            index > 0
        ) {

            otpInputs[index - 1].focus();

        }

    });

});


/* ==========================================
   OTP VERIFICATION
========================================== */

document
    .getElementById("otpForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let otp = "";


        otpInputs.forEach(input => {

            otp += input.value;

        });


        const message =
            document.getElementById("otpMessage");


        /*
           Demo OTP
           ----------------
           Use: 123456
        */

        if (otp === "123456") {

            message.textContent =
                "Mobile number verified successfully!";


        } else {

            message.textContent =
                "Invalid OTP. Try 123456 for this demo.";

        }

    });

</script>


</body>

</html>
